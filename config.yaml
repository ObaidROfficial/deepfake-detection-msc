# COM7014 Advanced Computing Project - central configuration
#
# Every script reads from this file. Change settings here, not in the code,
# so experiments stay reproducible and the report can cite exact values.
#
# WARNING: do not edit this file with `yaml.safe_dump` - it strips every
# comment. The reasoning recorded below is referenced throughout the report.
# Edit by hand.

project:
  name: "AI-Based Deepfake Detection Using Machine Learning with Robustness Evaluation"
  student: "Muhammad Obaid Ur Rehman"
  student_id: "STU1215887"
  module: "COM7014"
  seed: 42                    # used everywhere: sampling, splits, torch, numpy

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  manifests: "data/manifests"
  models: "models"
  results: "results"
  figures: "results/figures"

# ---------------------------------------------------------------------------
# Datasets
#
# A = train/validate/test (in-domain). Fully synthetic StyleGAN faces vs real
#     FFHQ photographs.
# B = cross-dataset evaluation ONLY, never seen in training. OpenForensics:
#     in-the-wild face forgeries with varied pose, lighting and background.
#
# Different generation methods on purpose. Testing A -> B measures whether the
# model learned "what a fake face looks like" or "what StyleGAN artefacts look
# like". Independence verified before training - see docs/ch5_findings.md 5.5.
# ---------------------------------------------------------------------------
datasets:
  a_train:
    kaggle_slug: "xhlulu/140k-real-and-fake-faces"
    name: "140k Real and Fake Faces"
    description: "70k real (Flickr/FFHQ) + 70k fake (StyleGAN, 1M Fake Faces)"
    native_size: 256
    licence: "Real images from NVIDIA FFHQ (CC BY-NC-SA 4.0). Non-commercial."
  b_crosstest:
    kaggle_slug: "manjilkarki/deepfake-and-real-images"
    name: "Deepfake and Real Images (OpenForensics)"
    description: "~190k images derived from OpenForensics, in-the-wild forgeries"
    source: "https://zenodo.org/record/5528418"
    native_size: 256
    licence: "OpenForensics - research use. See Zenodo record."

# ---------------------------------------------------------------------------
# Subsampling
#
# Not all 140k images are used. Training on the full set is not feasible on a
# CPU-only machine inside the project timeline. A documented trade-off between
# statistical power and available compute; sampling is seeded so the exact
# subset is reproducible.
# ---------------------------------------------------------------------------
subset:
  train_size: 20000           # 10k real / 10k fake, balanced
  val_size: 4000
  test_size: 4000
  crosstest_size: 6000        # from Dataset B

  # Raised 128 -> 224 after the converged 128px run plateaued at 78.7%
  # in-domain. The model was no longer underfitting (train and validation
  # accuracy within 0.002), so the bottleneck was information, not training
  # time. GAN artefacts are high-frequency (Frank et al., 2020); downscaling
  # 256 -> 128 discards them. Worth +10.1 accuracy points - see ch6_results 6.2.
  image_size: 224

  balanced: true

  # Dataset A ships official train/valid/test folders (100k/20k/20k). Each
  # subset is drawn from the CORRESPONDING official folder rather than randomly
  # across all 140k, so results stay comparable to published work on this
  # benchmark and there is no argument about the protocol.
  respect_official_splits: true

# ---------------------------------------------------------------------------
# Compute
# Machine: 12 physical cores / 14 logical, 16GB RAM, Intel integrated
# graphics, no CUDA.
# ---------------------------------------------------------------------------
compute:
  device: "cpu"

  # 8 of 12 cores. Gains past this are marginal (memory bandwidth bound) and
  # the headroom keeps the laptop usable during multi-hour runs.
  torch_threads: 8

  # 4 worked for all three training runs. Set to 0 if DataLoader workers hang
  # or crash - Windows uses spawn rather than fork, which is occasionally
  # fragile. Note that 0 is noticeably slower.
  dataloader_workers: 4

  pin_memory: false           # no GPU, so this does nothing useful

# ---------------------------------------------------------------------------
# Training - two-stage transfer learning
# ---------------------------------------------------------------------------
training:
  batch_size: 32
  epochs_frozen: 3            # stage 1: classifier head only

  # Raised twice. Both earlier runs hit the epoch cap without early stopping
  # firing, with validation accuracy still climbing and still ABOVE training
  # accuracy. Give early stopping room to actually decide when to halt.
  epochs_finetune: 32

  # Default; overridden per model under models.cnn below.
  unfreeze_blocks: 3

  lr_frozen: 0.001
  lr_finetune: 0.0001
  weight_decay: 0.0001
  early_stopping_patience: 3
  checkpoint_every_epoch: true    # allows --resume after interruption

# Deliberately mild. Aggressive colour or geometric distortion risks destroying
# the low-level forensic artefacts the model needs, which is self-defeating.
augmentation:
  horizontal_flip: 0.5
  rotation_degrees: 10
  colour_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.1

# ---------------------------------------------------------------------------
# Models
# ---------------------------------------------------------------------------
models:
  baselines:
    # HOG at 16px cells on 224px images gives ~6,110 dims; 10,000 x 6,110
    # float32 is ~244MB, ~489MB after StandardScaler. Fits in 16GB.
    train_size: 10000
    models:
      - name: "logistic_regression"
        description: "Flattened 32x32 greyscale pixels. Deliberately weak floor."
        max_iter: 1000
      - name: "hog_lbp_svm"
        description: "HOG + Local Binary Patterns -> Linear SVM. Classical CV baseline."
        hog_orientations: 9
        hog_pixels_per_cell: 16
        lbp_radius: 3
        lbp_points: 24

  cnn:
    # unfreeze_blocks is set PER MODEL here, overriding training.unfreeze_blocks.
    #
    # Why: the backbones are structured differently. MobileNetV2's `features`
    # is a Sequential of 19 small blocks; EfficientNet-B0's is 9 much larger
    # stages. The same integer would unfreeze roughly 16% of MobileNetV2
    # against ~79% of EfficientNet-B0, so any performance difference would
    # partly reflect adaptation capacity rather than architecture.
    #
    # Chosen to match TRAINABLE PARAMETER COUNT instead:
    #   MobileNetV2   last 3 of 19 blocks -> 1,208,642 trainable (measured)
    #   EfficientNet  last 2 of 9 stages  -> ~1.13M trainable (estimated)
    #
    # train.py logs the actual count at the start of stage 2. If EfficientNet
    # is far from ~1.2M, adjust and record the change in Chapter 6.
    - name: "mobilenet_v2"
      pretrained: true
      unfreeze_blocks: 3
      description: "Primary model. 2.23M params, depthwise separable convolutions."
    - name: "efficientnet_b0"
      pretrained: true
      unfreeze_blocks: 2
      description: "Architecture comparison. 4.01M params, compound-scaled."

# ---------------------------------------------------------------------------
# Robustness suite - the distinctive contribution (RQ4)
#
# Families split into destructive (information irreversibly lost), additive
# (signal buried), and rescaling (spatial structure preserved). The prediction
# that destructive should hurt most was recorded before running - see
# docs/ch7_robustness_findings.md.
# ---------------------------------------------------------------------------
robustness:
  jpeg_quality: [90, 70, 50, 30, 10]
  gaussian_noise_sigma: [0.01, 0.05, 0.10]
  gaussian_blur_kernel: [3, 5, 7]
  downscale_factors: [64, 32]       # round-trip: downscale then back up
  brightness_shift: [-0.4, -0.2, 0.2, 0.4]
  contrast_shift: [-0.4, -0.2, 0.2, 0.4]
  fgsm_epsilon: [0.005, 0.01, 0.03]
  fgsm_subset_size: 500             # full test set FGSM is too slow on CPU

evaluation:
  metrics: ["accuracy", "precision", "recall", "f1", "roc_auc"]
  save_confusion_matrix: true
  save_roc_curve: true
  save_pr_curve: true
